<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutorMoz — Matemática</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
#app{width:100%;max-width:420px;min-height:100vh;background:#fff;padding:0}
.screen{display:none;flex-direction:column;gap:14px;padding:20px}
.screen.active{display:flex}
.card{background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:16px 20px}
.card-green{background:#f0faf5;border:1px solid #a8dfc7}
.btn{width:100%;padding:11px 16px;border-radius:8px;border:1px solid #d0cec8;background:#fff;color:#1a1a1a;font-size:15px;cursor:pointer;text-align:left;font-family:inherit}
.btn:hover{background:#f5f5f0}
.btn:active{transform:scale(0.98)}
.btn-green{background:#1a8f65;color:#fff;border-color:#1a8f65;text-align:center;font-size:15px;padding:13px;font-weight:500}
.btn-green:hover{background:#147a55;color:#fff}
.btn-blue{background:#1a5fa8;color:#fff;border-color:#1a5fa8;text-align:center;font-size:15px;padding:13px;font-weight:500}
.btn-blue:hover{background:#144d8c;color:#fff}
.btn-muted{background:#f5f5f0;border:none;text-align:center;font-size:14px;color:#666;padding:9px}
.btn-muted:hover{background:#ebe9e3}
.inp{width:100%;padding:11px 13px;border-radius:8px;border:1px solid #d0cec8;background:#fff;color:#1a1a1a;font-size:15px;font-family:inherit}
.inp:focus{outline:none;border-color:#1a8f65;box-shadow:0 0 0 3px rgba(26,143,101,0.12)}
select.inp{cursor:pointer}
.lbl{font-size:13px;color:#666;margin-bottom:5px}
.ttl{font-size:20px;font-weight:600;color:#1a1a1a}
.sub{font-size:14px;color:#666}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.bg{background:#e0f5ec;color:#0a5e3a}
.bb{background:#e0eef9;color:#0a3d6e}
.ba{background:#fef3e0;color:#7a4a00}
.br{background:#fde8e8;color:#8b1a1a}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0}
.stat-card{background:#f5f5f0;border-radius:8px;padding:14px;text-align:center}
.divider{border:none;border-top:1px solid #e8e6e0}
.progress-bar{height:6px;background:#e8e6e0;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:#1a8f65;border-radius:3px;transition:width 0.4s ease}
.answer-btn{width:100%;padding:11px 14px;border-radius:8px;border:1px solid #d0cec8;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;text-align:left;font-family:inherit;line-height:1.4}
.answer-btn:hover:not(:disabled){border-color:#1a8f65;background:#f0faf5}
.ans-correct{background:#e0f5ec!important;border-color:#1a8f65!important;color:#0a5e3a!important;font-weight:500}
.ans-wrong{background:#fde8e8!important;border-color:#d84040!important;color:#8b1a1a!important}
.chat-area{display:flex;flex-direction:column;gap:10px;min-height:220px}
.msg-bubble{max-width:88%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
.msg-aluno{background:#1a8f65;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg-tutor{background:#f0f0eb;color:#1a1a1a;align-self:flex-start;border-bottom-left-radius:3px}
.msg-typing{background:#f0f0eb;color:#888;align-self:flex-start;border-bottom-left-radius:3px;font-style:italic}
.expl-box{background:#f5f5f0;border-left:3px solid #1a8f65;padding:12px;border-radius:0 8px 8px 0;font-size:14px;color:#444;line-height:1.6}
.logo-icon{width:60px;height:60px;border-radius:50%;background:#e0f5ec;display:flex;align-items:center;justify-content:center;margin:0 auto}
</style>
</head>
<body>
<div id="app"></div>

<script>
const CUR={
"4ª Classe":{
"Números até 10.000":{intro:"Os números até 10.000 têm quatro algarismos. Por exemplo, 3.456 tem 3 milhares, 4 centenas, 5 dezenas e 6 unidades.",qs:[
{q:"Qual o valor do algarismo 7 em 7.432?",o:["7 unidades","7 dezenas","7 milhares","7 centenas"],r:2,e:"O algarismo 7 está na posição dos milhares, portanto vale 7.000."},
{q:"Escreve por extenso: 5.203",o:["Cinco mil e três","Cinco mil duzentos e três","Cinquenta e dois e três","Cinco e duzentos e três"],r:1,e:"5.203 = 5 milhares + 2 centenas + 0 dezenas + 3 unidades."},
{q:"Qual o maior número de 4 algarismos?",o:["9.000","9.999","1.000","9.990"],r:1,e:"Com 4 algarismos o maior possível é 9.999."},
{q:"Ordena do menor ao maior: 4.320, 4.032, 4.302",o:["4.320, 4.302, 4.032","4.032, 4.302, 4.320","4.302, 4.032, 4.320","4.032, 4.320, 4.302"],r:1,e:"4.032 < 4.302 < 4.320. Compara algarismo a algarismo da esquerda para a direita."},
{q:"Qual o antecessor de 6.000?",o:["6.001","5.999","5.990","6.010"],r:1,e:"O antecessor é o número anterior: 6.000 − 1 = 5.999."}
]},
"Adição e Subtracção":{intro:"Na adição somamos quantidades. Na subtracção tiramos uma quantidade de outra. Alinha sempre as unidades antes de calcular!",qs:[
{q:"Quanto é 3.456 + 2.341?",o:["5.797","5.707","6.797","5.897"],r:0,e:"Soma coluna por coluna: 6+1=7, 5+4=9, 4+3=7, 3+2=5 → 5.797."},
{q:"Quanto é 8.000 − 3.456?",o:["4.544","4.644","5.544","4.444"],r:0,e:"8.000 − 3.456 = 4.544."},
{q:"Tens 5.200 Mt e gastas 1.750 Mt. Quanto fica?",o:["3.450 Mt","3.550 Mt","3.350 Mt","4.450 Mt"],r:0,e:"5.200 − 1.750 = 3.450 meticais."},
{q:"Uma escola tem 2.345 raparigas e 1.876 rapazes. Total de alunos?",o:["4.121","4.221","4.321","3.221"],r:1,e:"2.345 + 1.876 = 4.221 alunos."},
{q:"Quanto é 9.000 − 4.567?",o:["4.433","4.333","5.433","4.443"],r:0,e:"9.000 − 4.567 = 4.433."}
]},
"Multiplicação":{intro:"Multiplicar é uma forma rápida de somar parcelas iguais. 4×3 significa somar o 4 três vezes: 4+4+4=12.",qs:[
{q:"Quanto é 7 × 8?",o:["54","56","48","64"],r:1,e:"7 × 8 = 56."},
{q:"Quanto é 23 × 4?",o:["82","92","84","96"],r:1,e:"23×4 = (20×4)+(3×4) = 80+12 = 92."},
{q:"6 caixas com 12 laranjas cada. Total?",o:["62","70","72","68"],r:2,e:"6 × 12 = 72 laranjas."},
{q:"Quanto é 45 × 3?",o:["125","135","115","145"],r:1,e:"45×3 = (40×3)+(5×3) = 120+15 = 135."},
{q:"Um agricultor planta 8 fileiras com 15 plantas cada. Total?",o:["100","110","120","130"],r:2,e:"8 × 15 = 120 plantas."}
]},
"Divisão":{intro:"Dividir é repartir em partes iguais. 12÷4=3 significa 12 repartido em 4 partes iguais = 3 cada.",qs:[
{q:"Quanto é 48 ÷ 6?",o:["6","7","8","9"],r:2,e:"48 ÷ 6 = 8 porque 8×6=48."},
{q:"56 ÷ 7 = ?",o:["6","7","8","9"],r:2,e:"56 ÷ 7 = 8 porque 7×8=56."},
{q:"36 rebuçados para 4 crianças. Quantos cada uma?",o:["7","8","9","10"],r:2,e:"36 ÷ 4 = 9."},
{q:"84 ÷ 4 = ?",o:["18","20","21","24"],r:2,e:"84 ÷ 4 = 21. Verifica: 21×4=84."},
{q:"Uma mãe divide 72 Mt igualmente entre 8 filhos. Quanto recebe cada um?",o:["7 Mt","8 Mt","9 Mt","10 Mt"],r:2,e:"72 ÷ 8 = 9 Mt para cada filho."}
]},
"Fracções":{intro:"Uma fracção representa parte de um todo. Em 3/4, o 3 é numerador e o 4 denominador. Significa 3 partes de um todo dividido em 4.",qs:[
{q:"Qual o numerador de 5/8?",o:["8","5","3","13"],r:1,e:"O numerador é o número de cima — neste caso, 5."},
{q:"Qual fracção representa metade?",o:["1/4","2/3","1/2","3/4"],r:2,e:"1/2 representa metade."},
{q:"3/4 de 20 = ?",o:["10","12","15","16"],r:2,e:"3/4 de 20 = (3×20)÷4 = 60÷4 = 15."},
{q:"Qual fracção é maior: 2/3 ou 3/5?",o:["3/5","São iguais","2/3","Não é possível saber"],r:2,e:"2/3=10/15 e 3/5=9/15. Logo 2/3 > 3/5."},
{q:"Uma pizza foi dividida em 8 partes. Comeste 3. Que fracção comeste?",o:["3/5","5/8","3/8","8/3"],r:2,e:"Comeste 3 de 8 partes = 3/8 da pizza."}
]},
"Grandezas e Medidas":{intro:"Medimos comprimento (metros), massa (quilogramas), capacidade (litros) e tempo (horas, minutos, segundos).",qs:[
{q:"Quantos centímetros tem 1 metro?",o:["10","100","1.000","10.000"],r:1,e:"1 metro = 100 centímetros."},
{q:"Quantos minutos tem 2 horas?",o:["100","120","60","200"],r:1,e:"1 hora=60 min, logo 2 horas=120 min."},
{q:"Quantos ml tem 1 litro?",o:["100","500","1.000","10.000"],r:2,e:"1 litro = 1.000 mililitros."},
{q:"Converte 3 km para metros",o:["300 m","3.000 m","30 m","30.000 m"],r:1,e:"1 km = 1.000 m. 3 km = 3.000 m."},
{q:"Uma corrida tem 5.000 m. Quantos km são?",o:["0,5 km","5 km","50 km","500 km"],r:1,e:"5.000 m ÷ 1.000 = 5 km."}
]},
"Geometria Básica":{intro:"Figuras planas: triângulo (3 lados), quadrado (4 lados iguais), rectângulo (lados opostos iguais), círculo.",qs:[
{q:"Quantos lados tem um triângulo?",o:["2","3","4","5"],r:1,e:"Um triângulo tem sempre 3 lados e 3 ângulos."},
{q:"Área de um quadrado de lado 5 cm?",o:["10 cm²","20 cm²","25 cm²","30 cm²"],r:2,e:"Área = lado × lado = 5×5 = 25 cm²."},
{q:"Qual figura tem 4 lados iguais e 4 ângulos rectos?",o:["Triângulo","Rectângulo","Quadrado","Círculo"],r:2,e:"O quadrado tem 4 lados iguais e 4 ângulos de 90°."},
{q:"Perímetro de um quadrado de lado 6 cm?",o:["12 cm","18 cm","24 cm","36 cm"],r:2,e:"Perímetro = 4 × lado = 4×6 = 24 cm."},
{q:"Qual figura não tem lados retos?",o:["Quadrado","Triângulo","Círculo","Rectângulo"],r:2,e:"O círculo é uma figura curva — não tem lados retos."}
]}
},
"5ª Classe":{
"Números Naturais":{intro:"Os números naturais são 0,1,2,3,... Usamo-los para contar e ordenar. Todo número tem um sucessor (número seguinte) e um antecessor (número anterior).",qs:[
{q:"Qual o sucessor de 9.999?",o:["9.998","10.000","9.990","10.001"],r:1,e:"9.999 + 1 = 10.000."},
{q:"Qual o antecessor de 5.000?",o:["5.001","4.999","4.000","5.010"],r:1,e:"5.000 − 1 = 4.999."},
{q:"Ordena do menor ao maior: 3.210, 3.021, 3.201",o:["3.210,3.201,3.021","3.021,3.201,3.210","3.201,3.021,3.210","3.021,3.210,3.201"],r:1,e:"3.021 < 3.201 < 3.210."},
{q:"Qual o maior número par de 4 algarismos?",o:["9.998","9.999","9.990","8.888"],r:0,e:"9.998 — é par (termina em 8) e é o maior de 4 algarismos."},
{q:"Quantos números naturais há entre 5 e 10 (exclusive)?",o:["3","4","5","6"],r:1,e:"6, 7, 8, 9 — são 4 números entre 5 e 10."}
]},
"Decimais":{intro:"Em 3,45 — o 3 é parte inteira, 4 são décimas e 5 centésimas. A vírgula separa a parte inteira da decimal.",qs:[
{q:"Quanto é 2,5 + 1,3?",o:["3,8","3,85","4,8","3,08"],r:0,e:"2,5 + 1,3 = 3,8. Alinha a vírgula e soma."},
{q:"Qual é maior: 0,9 ou 0,85?",o:["0,85","São iguais","0,9","Não sei"],r:2,e:"0,9 = 0,90 > 0,85."},
{q:"5 × 0,2 = ?",o:["0,1","1","10","0,01"],r:1,e:"5 × 0,2 = 1,0."},
{q:"Quanto é 3,7 − 1,4?",o:["1,3","2,3","2,4","1,7"],r:1,e:"3,7 − 1,4 = 2,3."},
{q:"Um produto custa 12,50 Mt. Pagas com 20 Mt. Quanto recebes de troco?",o:["7,50 Mt","8,50 Mt","7,00 Mt","6,50 Mt"],r:0,e:"20,00 − 12,50 = 7,50 Mt de troco."}
]},
"Fracções":{intro:"Para comparar fracções com denominadores diferentes, encontra o mínimo múltiplo comum. Para simplificar, divide numerador e denominador pelo mesmo número.",qs:[
{q:"Simplifica 6/8",o:["3/4","2/3","1/2","4/6"],r:0,e:"6÷2=3 e 8÷2=4. Logo 6/8 = 3/4."},
{q:"1/3 + 1/3 = ?",o:["2/6","2/3","1/6","1/9"],r:1,e:"Mesmo denominador: soma os numeradores. 1+1=2 → 2/3."},
{q:"Qual é maior: 3/5 ou 2/3?",o:["3/5","São iguais","2/3","Não sei"],r:2,e:"3/5=9/15 e 2/3=10/15. Logo 2/3>3/5."},
{q:"1/2 + 1/4 = ?",o:["2/6","3/4","1/8","2/4"],r:1,e:"MMC(2,4)=4. 1/2=2/4. Logo 2/4+1/4=3/4."},
{q:"Simplifica 10/15",o:["2/3","3/5","1/3","5/10"],r:0,e:"10÷5=2 e 15÷5=3. Logo 10/15 = 2/3."}
]},
"Percentagem":{intro:"Percentagem significa 'por cem'. 25% = 25/100 = 0,25. Para calcular x% de um número: multiplica por x e divide por 100.",qs:[
{q:"10% de 200 = ?",o:["10","20","200","100"],r:1,e:"200 × 10 ÷ 100 = 20."},
{q:"50% é igual a que fracção?",o:["1/4","1/3","1/2","3/4"],r:2,e:"50% = 50/100 = 1/2."},
{q:"80% de 40 = ?",o:["24","32","30","36"],r:1,e:"40 × 80 ÷ 100 = 32."},
{q:"Num mercado, um pano custa 500 Mt e tem 10% de desconto. Quanto poupas?",o:["10 Mt","50 Mt","100 Mt","500 Mt"],r:1,e:"500 × 10 ÷ 100 = 50 Mt de desconto."},
{q:"Que percentagem é 25 de 100?",o:["25%","10%","50%","75%"],r:0,e:"25/100 × 100 = 25%."}
]},
"Geometria":{intro:"Perímetro é a soma de todos os lados. Área é a superfície interior. Área do rectângulo = comprimento × largura.",qs:[
{q:"Perímetro de rectângulo 6×4 cm?",o:["24 cm","10 cm","20 cm","22 cm"],r:2,e:"P = 2×(6+4) = 2×10 = 20 cm."},
{q:"Área de rectângulo 8×3 cm?",o:["22 cm²","11 cm²","24 cm²","16 cm²"],r:2,e:"A = 8 × 3 = 24 cm²."},
{q:"Triângulo base 10 cm altura 6 cm. Área?",o:["60 cm²","30 cm²","16 cm²","20 cm²"],r:1,e:"A = (base × altura) ÷ 2 = (10×6)÷2 = 30 cm²."},
{q:"Um campo de futebol mede 100m × 60m. Qual o seu perímetro?",o:["160 m","320 m","600 m","260 m"],r:1,e:"P = 2×(100+60) = 2×160 = 320 m."},
{q:"Área de um quadrado de lado 7 cm?",o:["14 cm²","28 cm²","42 cm²","49 cm²"],r:3,e:"A = 7 × 7 = 49 cm²."}
]},
"Proporcionalidade":{intro:"Duas grandezas são directamente proporcionais quando, ao duplicar uma, a outra também duplica.",qs:[
{q:"3 cadernos = 90 Mt. 5 cadernos = ?",o:["120 Mt","150 Mt","180 Mt","100 Mt"],r:1,e:"1 caderno = 30 Mt. 5 × 30 = 150 Mt."},
{q:"120 km em 2h. Quantos km em 5h?",o:["240 km","300 km","350 km","250 km"],r:1,e:"60 km/h × 5h = 300 km."},
{q:"4 kg de arroz = 200 Mt. 7 kg = ?",o:["300 Mt","325 Mt","350 Mt","400 Mt"],r:2,e:"1 kg = 50 Mt. 7 × 50 = 350 Mt."},
{q:"Se 2 litros de óleo custam 120 Mt, quanto custam 5 litros?",o:["240 Mt","300 Mt","360 Mt","250 Mt"],r:1,e:"1 litro = 60 Mt. 5 × 60 = 300 Mt."},
{q:"Um operário ganha 800 Mt em 4 dias. Quanto ganha em 6 dias?",o:["1.000 Mt","1.100 Mt","1.200 Mt","1.400 Mt"],r:2,e:"1 dia = 200 Mt. 6 × 200 = 1.200 Mt."}
]},
"Sólidos Geométricos":{intro:"Sólidos geométricos têm três dimensões. O cubo tem 6 faces quadradas, 12 arestas e 8 vértices.",qs:[
{q:"Quantas faces tem um cubo?",o:["4","5","6","8"],r:2,e:"Um cubo tem 6 faces quadradas e iguais."},
{q:"Quantas arestas tem um cubo?",o:["8","12","6","10"],r:1,e:"12 arestas: 4 em cima + 4 em baixo + 4 laterais."},
{q:"Qual sólido tem base circular?",o:["Cubo","Prisma","Cilindro","Pirâmide"],r:2,e:"O cilindro tem duas bases circulares paralelas."},
{q:"Quantos vértices tem um cubo?",o:["6","8","10","12"],r:1,e:"Um cubo tem 8 vértices (cantos)."},
{q:"Qual sólido tem apenas uma base e um vértice no topo?",o:["Cilindro","Prisma","Cubo","Pirâmide"],r:3,e:"A pirâmide tem uma base poligonal e todas as faces laterais encontram-se num vértice."}
]}
},
"6ª Classe":{
"Potenciação":{intro:"A potenciação é uma multiplicação repetida. 2³ = 2×2×2 = 8. O 2 é a base e o 3 é o expoente.",qs:[
{q:"Quanto é 3²?",o:["6","8","9","12"],r:2,e:"3² = 3×3 = 9."},
{q:"Quanto é 2⁴?",o:["8","12","16","20"],r:2,e:"2⁴ = 2×2×2×2 = 16."},
{q:"5¹ = ?",o:["1","5","10","25"],r:1,e:"Qualquer número elevado a 1 é ele próprio: 5¹ = 5."},
{q:"Quanto é 10³?",o:["30","100","1.000","10.000"],r:2,e:"10³ = 10×10×10 = 1.000."},
{q:"Qual o resultado de 4²?",o:["8","12","16","24"],r:2,e:"4² = 4×4 = 16."}
]},
"Números Inteiros":{intro:"...-3,-2,-1,0,1,2,3... Os números negativos aparecem em temperaturas abaixo de zero, dívidas e altitudes abaixo do nível do mar.",qs:[
{q:"Qual é maior: −3 ou −7?",o:["−7","São iguais","−3","Não sei"],r:2,e:"Na recta numérica, −3 está à direita de −7, logo −3 > −7."},
{q:"(−5) + 3 = ?",o:["8","−8","−2","2"],r:2,e:"Partimos de −5 e avançamos 3 → −2."},
{q:"(−4) × (−3) = ?",o:["−12","7","12","−7"],r:2,e:"Negativo × negativo = positivo. (−4)×(−3) = +12."},
{q:"Ordena do menor ao maior: −2, 5, −8, 0",o:["−8, −2, 0, 5","5, 0, −2, −8","−2, −8, 0, 5","0, −2, −8, 5"],r:0,e:"Da esquerda para a direita na recta: −8 < −2 < 0 < 5."},
{q:"(−6) + (−4) = ?",o:["−10","10","2","−2"],r:0,e:"Dois negativos somam-se: −6 + (−4) = −10."}
]},
"Fracções Avançadas":{intro:"Para somar fracções com denominadores diferentes, encontra primeiro o MMC (mínimo múltiplo comum) dos denominadores.",qs:[
{q:"1/2 + 1/3 = ?",o:["2/5","2/6","5/6","1/6"],r:2,e:"MMC(2,3)=6. 3/6 + 2/6 = 5/6."},
{q:"3/4 − 1/3 = ?",o:["2/1","5/12","1/12","7/12"],r:1,e:"MMC(4,3)=12. 9/12 − 4/12 = 5/12."},
{q:"(2/3) × (3/4) = ?",o:["5/7","1/2","6/12","2/4"],r:1,e:"(2×3)/(3×4) = 6/12 = 1/2."},
{q:"(4/5) ÷ (2/5) = ?",o:["8/25","2","1/2","4/10"],r:1,e:"Dividir por uma fracção = multiplicar pelo inverso. 4/5 × 5/2 = 20/10 = 2."},
{q:"1/4 + 3/8 = ?",o:["4/12","5/8","4/8","2/8"],r:1,e:"MMC(4,8)=8. 2/8 + 3/8 = 5/8."}
]},
"Equações":{intro:"Uma equação é uma igualdade com uma incógnita (x). Para resolver, isolamos o x fazendo operações inversas em ambos os lados.",qs:[
{q:"x + 5 = 12",o:["x=6","x=7","x=17","x=5"],r:1,e:"x = 12 − 5 = 7."},
{q:"3x = 18",o:["x=3","x=5","x=6","x=15"],r:2,e:"x = 18 ÷ 3 = 6."},
{q:"2x − 4 = 10",o:["x=3","x=6","x=7","x=14"],r:2,e:"2x = 14 → x = 7."},
{q:"x/3 = 5",o:["x=8","x=15","x=2","x=3"],r:1,e:"x = 5 × 3 = 15."},
{q:"4x + 2 = 18",o:["x=3","x=4","x=5","x=6"],r:1,e:"4x = 16 → x = 4."}
]},
"Percentagem Avançada":{intro:"Aumento: valor final = valor inicial × (1 + taxa). Desconto: valor final = valor inicial × (1 − taxa).",qs:[
{q:"500 Mt com 20% desconto. Preço final?",o:["300 Mt","400 Mt","450 Mt","480 Mt"],r:1,e:"Desconto = 500×20% = 100 Mt. Final = 500−100 = 400 Mt."},
{q:"Salário 8.000 Mt com aumento de 15%?",o:["8.800 Mt","9.000 Mt","9.200 Mt","8.600 Mt"],r:2,e:"Aumento = 8.000×15% = 1.200 Mt. Total = 9.200 Mt."},
{q:"Que percentagem é 60 de 200?",o:["20%","25%","30%","35%"],r:2,e:"60/200 × 100 = 30%."},
{q:"Um comerciante comprou por 2.000 Mt e vendeu por 2.500 Mt. Qual o lucro em %?",o:["20%","25%","30%","50%"],r:1,e:"Lucro = 500 Mt. 500/2.000 × 100 = 25%."},
{q:"Desconto de 30% num artigo de 1.000 Mt. Quanto pagas?",o:["300 Mt","500 Mt","700 Mt","750 Mt"],r:2,e:"Desconto = 300 Mt. Pagas 1.000 − 300 = 700 Mt."}
]},
"Razões e Proporções":{intro:"Uma razão compara dois números. A razão 3:4 significa que para cada 3 há 4. Numa proporção, duas razões são iguais: a/b = c/d.",qs:[
{q:"15 rapazes e 10 raparigas. Razão rapaz:rapariga?",o:["2:3","3:2","1:2","5:3"],r:1,e:"15:10 = 3:2 (simplificado por 5)."},
{q:"Razão 2:5 e total 35. Quantos de cada?",o:["10 e 25","14 e 21","12 e 23","8 e 27"],r:0,e:"Partes = 2+5=7. Cada parte = 35÷7=5. Logo: 10 e 25."},
{q:"Resolve: 3/x = 6/10",o:["x=3","x=4","x=5","x=6"],r:2,e:"3×10 = 6×x → 30 = 6x → x = 5."},
{q:"Numa receita usa-se farinha e açúcar na razão 3:1. Para 600g de farinha, quantos g de açúcar?",o:["100g","150g","200g","300g"],r:2,e:"Para cada 3g de farinha, 1g de açúcar. 600÷3 = 200g."},
{q:"Divide 120 Mt na razão 1:3",o:["40 e 80","30 e 90","20 e 100","60 e 60"],r:1,e:"Total partes = 1+3=4. Cada parte = 30 Mt. Logo: 30 e 90 Mt."}
]},
"Grandezas Avançadas":{intro:"Volume do cubo = aresta³. Volume do paralelepípedo = comprimento × largura × altura.",qs:[
{q:"Volume de um cubo de aresta 4 cm?",o:["12 cm³","48 cm³","64 cm³","16 cm³"],r:2,e:"4³ = 4×4×4 = 64 cm³."},
{q:"Paralelepípedo 5×3×2 cm. Volume?",o:["10 cm³","16 cm³","30 cm³","25 cm³"],r:2,e:"5 × 3 × 2 = 30 cm³."},
{q:"Converte 2,5 km para metros",o:["25 m","250 m","2.500 m","25.000 m"],r:2,e:"2,5 × 1.000 = 2.500 m."},
{q:"Uma caixa mede 4m × 3m × 2m. Qual o seu volume?",o:["9 m³","18 m³","24 m³","30 m³"],r:2,e:"4 × 3 × 2 = 24 m³."},
{q:"Converte 3.500 ml para litros",o:["0,35 L","3,5 L","35 L","350 L"],r:1,e:"3.500 ÷ 1.000 = 3,5 litros."}
]}
}
};

const PRICES={"4ª Classe":150,"5ª Classe":150,"6ª Classe":150};

function save(){localStorage.setItem("tutormoz_v3",JSON.stringify(S.perfis))}
function go(s){S.screen=s;render()}

function render(){

  return `<div class="screen active">

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div class="avatar" style="background:#e0eef9;color:#1a5fa8">${a.nome.charAt(0).toUpperCase()}</div>

  </div>`;
}

function toggleClasse(i,c){
  const enc=S.perfis[S.encUser];
  const a=enc.alunos[i];
  if(!a.classes)a.classes=[];
  const idx=a.classes.indexOf(c);
  idx>=0?a.classes.splice(idx,1):a.classes.push(c);
  save();render();
}

function startChat(tema){

}

  const qs=CUR[S.classe][S.tema].qs;

  const pct=Math.round((S.qIdx/qs.length)*100);
  return `<div class="screen active">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <p style="font-size:13px;color:#666">${S.tema}</p>
      <p style="font-size:13px;font-weight:600">${S.qIdx+1} / ${qs.length}</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#1a8f65">${S.pontos}</p><p style="font-size:12px;color:#888;margin-top:2px">Pontos</p></div>
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#c0392b">${S.erros}</p><p style="font-size:12px;color:#888;margin-top:2px">Erros</p></div>
    </div>
    <div class="card"><p style="font-size:16px;font-weight:500;line-height:1.5">${q.q}</p></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${q.o.map((o,i)=>{
        let cls="answer-btn";
        if(S.answered){if(i===q.r)cls+=" ans-correct";else if(i===S.selOpt&&i!==q.r)cls+=" ans-wrong";}
        return `<button class="${cls}" onclick="responder(${i})" ${S.answered?"disabled":""}>${o}</button>`;
      }).join("")}
    </div>
    ${S.showExp?`<div class="expl-box">${q.e}</div>`:""}
    ${S.answered?`<div style="display:flex;gap:8px">
      <button class="btn-green btn" onclick="proxima()">Próxima →</button>
      <button class="btn-muted btn" style="width:auto;padding:11px 16px;font-size:13px" onclick="startChat('${S.tema}')">Dúvida?</button>
    </div>`:""}
  </div>`;
}

function responder(i){
  if(S.answered)return;
  const q=CUR[S.classe][S.tema].qs[S.qIdx];
  S.answered=true;S.selOpt=i;S.total++;
  if(i===q.r)S.pontos+=10;else{S.erros++;S.showExp=true;}
  render();
}

function proxima(){
  S.qIdx++;S.answered=false;S.selOpt=null;S.showExp=false;
  if(S.qIdx>=CUR[S.classe][S.tema].qs.length)go("tutor-result");else render();
}

function rTutorResult(){
  const total=CUR[S.classe][S.tema].qs.length;
  const certas=S.pontos/10;
  const pct=Math.round((certas/total)*100);
  const enc=S.perfis[S.encUser];
  if(enc){
    const idx=enc.alunos.findIndex(a=>a.nome===S.aluno.nome);
    if(idx>=0){
      if(!enc.alunos[idx].stats)enc.alunos[idx].stats={sessoes:0,certas:0,total:0};
      enc.alunos[idx].stats.sessoes++;
      enc.alunos[idx].stats.certas+=certas;
      enc.alunos[idx].stats.total+=total;
      save();
    }
  }
  const cor=pct>=80?"#1a8f65":pct>=50?"#1a5fa8":"#c0392b";
  const msg=pct>=80?"Excelente trabalho!":pct>=50?"Bom esforço!":"Continua a praticar!";
  const bg=pct>=80?"#e0f5ec":pct>=50?"#e0eef9":"#fef3e0";
  return `<div class="screen active" style="align-items:center;text-align:center;padding-top:28px">
    <div style="width:80px;height:80px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center">
      <p style="font-size:28px;font-weight:700;color:${cor}">${pct}%</p>
    </div>
    <p class="ttl" style="margin-top:12px">${msg}</p>
    <p class="sub">${S.tema} • ${S.classe}</p>
    <div style="width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px">
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#1a8f65">${certas}</p><p style="font-size:12px;color:#888">Certas</p></div>
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#c0392b">${S.erros}</p><p style="font-size:12px;color:#888">Erros</p></div>
      <div class="stat-card"><p style="font-size:22px;font-weight:600">${S.pontos}</p><p style="font-size:12px;color:#888">Pontos</p></div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-top:16px">
      <button class="btn-green btn" onclick="selectTema('${S.tema}')">Repetir tema</button>
      <button class="btn-blue btn" onclick="startChat('${S.tema}')">Pedir ajuda ao Tutor IA</button>
      <button class="btn-muted btn" onclick="go('tutor-tema')">Outro tema</button>
      <button class="btn-muted btn" onclick="go('tutor-home')">Início</button>
    </div>
  </div>`;
}

function sendSug(t){
  const el=document.getElementById("chat-inp");
  if(el){el.value=t;sendChat();}
}

async function sendChat(){
  const inp=document.getElementById("chat-inp");
  if(!inp)return;
  const msg=inp.value.trim();
  if(!msg||S.chatLoading)return;
  S.chatHistory.push({role:"user",content:msg});
  S.chatLoading=true;render();
  const classe=S.aluno&&S.aluno.classes&&S.aluno.classes.length?S.aluno.classes.join(", "):"ensino primário";
  const systemPrompt=`És um tutor de matemática amigável e paciente para alunos moçambicanos do ensino primário (${classe}). Regras: 1) Responde SEMPRE em Português de Moçambique. 2) Explica passo a passo de forma simples. 3) Usa exemplos do quotidiano moçambicano (meticais, capulanas, machambas, mercados). 4) Quando o aluno erra, encoraja-o gentilmente. 5) Responde APENAS a perguntas de matemática. 6) Máximo 120 palavras. 7) Linguagem simples adequada à idade.`;
  try{
    const contents=S.chatHistory.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
    const resp=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AIzaSyD0a9VGyK8u-cbagtehZjJ2JjRVpnjdiEY",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        system_instruction:{parts:[{text:systemPrompt}]},
        contents:contents
      })
    });
    const data=await resp.json();
    const reply=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0]?data.candidates[0].content.parts[0].text:"Desculpa, houve um erro. Tenta de novo!";
    S.chatHistory.push({role:"assistant",content:reply});
  }catch(e){
    S.chatHistory.push({role:"assistant",content:"Não consigo responder agora. Verifica a tua ligação à internet."});
  }
  S.chatLoading=false;render();
  setTimeout(()=>{const c=document.getElementById("chat-msgs");if(c)c.scrollTop=c.scrollHeight;},60);
}

function bindAll(){
  const b=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  b("btn-login-enc",()=>{
    const tel=document.getElementById("e-tel").value.trim();
    const pin=document.getElementById("e-pin").value.trim();
    const enc=S.perfis[tel];
    if(!enc||enc.pin!==pin){document.getElementById("e-err").textContent="Dados incorrectos.";return;}
    S.encUser=tel;go("dash-enc");
  });
  b("btn-reg-enc",()=>{
    const nome=document.getElementById("r-nome").value.trim();
    const tel=document.getElementById("r-tel").value.trim();
    const pin=document.getElementById("r-pin").value.trim();
    if(!nome||!tel||pin.length<4){document.getElementById("r-err").textContent="Preenche todos os campos.";return;}
    if(S.perfis[tel]){document.getElementById("r-err").textContent="Número já registado.";return;}
    S.perfis[tel]={nome,pin,alunos:[]};save();S.encUser=tel;go("dash-enc");
  });
  b("btn-add-aluno",()=>{
    const nome=document.getElementById("a-nome").value.trim();
    const pin=document.getElementById("a-pin").value.trim();
    const cls=Array.from(document.querySelectorAll("#app input[type=checkbox]:checked")).map(c=>c.value);
    if(!nome||pin.length<4){document.getElementById("a-err").textContent="Preenche nome e PIN.";return;}
    const enc=S.perfis[S.encUser];
    enc.alunos.push({nome,pin,classes:cls,stats:{sessoes:0,certas:0,total:0}});
    save();go("gerir-alunos");
  });
  b("btn-login-aluno",()=>{
    const todos=[];
    Object.entries(S.perfis).forEach(([tel,enc])=>(enc.alunos||[]).forEach((a,i)=>todos.push({...a,tel,idx:i})));
    const sel=document.getElementById("al-sel").value;
    const pin=document.getElementById("al-pin").value.trim();
    if(sel===""){document.getElementById("al-err").textContent="Selecciona o teu nome.";return;}
    const a=todos[parseInt(sel)];
    if(a.pin!==pin){document.getElementById("al-err").textContent="PIN incorrecto.";return;}
    S.aluno={...a};S.encUser=a.tel;go("tutor-home");
  });
  b("btn-send",sendChat);
  const chatInp=document.getElementById("chat-inp");
  if(chatInp)chatInp.onkeypress=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}};
}

render();
</script>
</body>
</html>
