function startChat(tema){
  const intro=tema?`Olá ${S.aluno.nome.split(" ")[0]}! Estás a estudar "${tema}". Que dúvidas tens?`:`Olá ${S.aluno.nome.split(" ")[0]}! Sou o teu tutor de matemática. Que dúvidas tens hoje?`;
  S.chatHistory=[{role:"assistant",content:intro}];
  S.chatLoading=false;go("tutor-chat");
}

function rTutorChat(){
  const msgs=S.chatHistory.map(m=>`<div class="msg-bubble ${m.role==="user"?"msg-aluno":"msg-tutor"}">${m.content.replace(/\n/g,"<br>")}</div>`).join("");
  const loading=S.chatLoading?`<div class="msg-bubble msg-typing">A pensar...</div>`:"";
  return `<div class="screen active">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-muted btn" style="width:auto;padding:6px 14px" onclick="go('tutor-home')">← Voltar</button>

      ${["O que são fracções?","Como resolver equações?","Explica percentagens","O que é potenciação?"].map(s=>`<button onclick="sendSug('${s}')" style="padding:5px 10px;border-radius:20px;border:1px solid #d0cec8;background:#f5f5f0;color:#666;font-size:12px;cursor:pointer;font-family:inherit">${s}</button>`).join("")}
    </div>
    <div style="display:flex;gap:8px">
      <input class="inp" id="chat-inp" placeholder="Escreve a tua dúvida..." style="flex:1" ${S.chatLoading?"disabled":""}>
      <button class="btn-green btn" style="width:auto;padding:11px 18px" id="btn-send" ${S.chatLoading?"disabled":""}>Enviar</button>

}

function selectTema(t){
  S.tema=t;S.qIdx=0;S.pontos=0;S.erros=0;S.total=0;
  S.answered=false;S.selOpt=null;S.showExp=false;go("tutor-intro");
}

function rTutorIntro(){
  return `<div class="screen active">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-muted btn" style="width:auto;padding:6px 14px" onclick="go('tutor-tema')">← Voltar</button>
      <div><p class="ttl">${S.tema}</p><p class="sub">${S.classe}</p></div>
    </div>
    <div class="card card-green">
      <p style="font-size:13px;font-weight:600;color:#0a5e3a;margin-bottom:8px">Introdução</p>
      <p style="font-size:14px;color:#1a5e3a;line-height:1.7">${CUR[S.classe][S.tema].intro}</p>
    </div>
    <button class="btn-green btn" onclick="iniciarQuiz()">Começar os exercícios</button>
    <button class="btn-muted btn" onclick="startChat('${S.tema}')">Tenho dúvidas sobre este tema</button>
  </div>`;
}

function iniciarQuiz(){
  S.qIdx=0;S.pontos=0;S.erros=0;S.total=0;
  S.answered=false;S.selOpt=null;S.showExp=false;go("tutor-quiz");
}

function rTutorQuiz(){
  const qs=CUR[S.classe][S.tema].qs;
  if(S.qIdx>=qs.length){go("tutor-result");return "";}
  const q=qs[S.qIdx];
  const pct=Math.round((S.qIdx/qs.length)*100);
  return `<div class="screen active">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <p style="font-size:13px;color:#666">${S.tema}</p>
      <p style="font-size:13px;font-weight:600">${S.qIdx+1}/${qs.length}</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#1a8f65">${S.pontos}</p><p style="font-size:12px;color:#888;margin-top:2px">Pontos</p></div>
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#c0392b">${S.erros}</p><p style="font-size:12px;color:#888;margin-top:2px">Erros</p></div>
    </div>
    <div class="card"><p style="font-size:16px;font-weight:500;line-height:1.5">${q.q}</p></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${q.o.map((o,i)=>{
        let cls="answer-btn";
        if(S.answered){if(i===q.r)cls+=" ans-correct";else if(i===S.selOpt&&i!==q.r)cls+=" ans-wrong";}
        return `<button class="${cls}" onclick="responder(${i})" ${S.answered?"disabled":""}>${o}</button>`;
      }).join("")}
    </div>
    ${S.showExp?`<div class="expl-box">${q.e}</div>`:""}
    ${S.answered?`<div style="display:flex;gap:8px">
      <button class="btn-green btn" onclick="proxima()">Próxima →</button>
      <button class="btn-muted btn" style="width:auto;padding:11px 16px;font-size:13px" onclick="startChat('${S.tema}')">Dúvida?</button>
    </div>`:""}
  </div>`;
}

function responder(i){
  if(S.answered)return;
  const q=CUR[S.classe][S.tema].qs[S.qIdx];
  S.answered=true;S.selOpt=i;S.total++;
  if(i===q.r)S.pontos+=10;else{S.erros++;S.showExp=true;}
  render();
}

function proxima(){
  S.qIdx++;S.answered=false;S.selOpt=null;S.showExp=false;
  if(S.qIdx>=CUR[S.classe][S.tema].qs.length)go("tutor-result");else render();
}

function rTutorResult(){
  const total=CUR[S.classe][S.tema].qs.length;
  const certas=S.pontos/10;
  const pct=Math.round((certas/total)*100);
  saveProgress(certas,total);
  const cor=pct>=80?"#1a8f65":pct>=50?"#1a5fa8":"#c0392b";
  const msg=pct>=80?"Excelente trabalho!":pct>=50?"Bom esforço!":"Continua a praticar!";
  const bg=pct>=80?"#e0f5ec":pct>=50?"#e0eef9":"#fef3e0";
  return `<div class="screen active" style="align-items:center;text-align:center;padding-top:28px">
    <div style="width:80px;height:80px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center">
      <p style="font-size:28px;font-weight:700;color:${cor}">${pct}%</p>
    </div>
    <p class="ttl" style="margin-top:12px">${msg}</p>
    <p class="sub">${S.tema} • ${S.classe}</p>
    <div style="width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px">
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#1a8f65">${certas}</p><p style="font-size:12px;color:#888">Certas</p></div>
      <div class="stat-card"><p style="font-size:22px;font-weight:600;color:#c0392b">${S.erros}</p><p style="font-size:12px;color:#888">Erros</p></div>
      <div class="stat-card"><p style="font-size:22px;font-weight:600">${S.pontos}</p><p style="font-size:12px;color:#888">Pontos</p></div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px;margin-top:16px">
      <button class="btn-green btn" onclick="selectTema('${S.tema}')">Repetir tema</button>
      <button class="btn-blue btn" onclick="startChat('${S.tema}')">Pedir ajuda ao Tutor IA</button>
      <button class="btn-muted btn" onclick="go('tutor-tema')">Outro tema</button>
      <button class="btn-muted btn" onclick="go('tutor-home')">Início</button>
    </div>
  </div>`;
}

async function saveProgress(certas,total){
  if(!S.alunoId)return;
  const a=S.aluno;
  await db.from("alunos").update({
    sessoes:(a.sessoes||0)+1,
    certas:(a.certas||0)+certas,
    total:(a.total||0)+total
  }).eq("id",S.alunoId);
  S.aluno.sessoes=(a.sessoes||0)+1;
  S.aluno.certas=(a.certas||0)+certas;
  S.aluno.total=(a.total||0)+total;
}

function sendSug(t){
  const el=document.getElementById("chat-inp");
  if(el){el.value=t;sendChat();}
}

async function sendChat(){
  const inp=document.getElementById("chat-inp");
  if(!inp)return;
  const msg=inp.value.trim();
  if(!msg||S.chatLoading)return;
  S.chatHistory.push({role:"user",content:msg});
  S.chatLoading=true;render();
  const classe=S.aluno&&S.aluno.classes&&S.aluno.classes.length?S.aluno.classes.join(", "):"ensino primário";
  const systemPrompt=`És um tutor de matemática amigável e paciente para alunos moçambicanos do ensino primário (${classe}). Regras: 1) Responde SEMPRE em Português de Moçambique. 2) Explica passo a passo. 3) Usa exemplos moçambicanos (meticais, machambas, mercados). 4) Encoraja gentilmente quando o aluno erra. 5) Responde APENAS a perguntas de matemática. 6) Máximo 120 palavras.`;
  try{
    const contents=S.chatHistory.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
    const resp=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=AIzaSyD0a9VGyK8u-cbagtehZjJ2JjRVpnjdiEY",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({system_instruction:{parts:[{text:systemPrompt}]},contents})
    });
    const data=await resp.json();
    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||"Desculpa, houve um erro. Tenta de novo!";
    S.chatHistory.push({role:"assistant",content:reply});
  }catch(e){
    S.chatHistory.push({role:"assistant",content:"Não consigo responder agora. Verifica a tua ligação."});
  }
  S.chatLoading=false;render();
  setTimeout(()=>{const c=document.getElementById("chat-msgs");if(c)c.scrollTop=c.scrollHeight;},60);
}

function logout(){S.enc=null;S.aluno=null;S.alunoId=null;go("welcome")}

async function toggleClasse(alunoId,c){
  const enc=S.enc;
  const a=enc.alunos.find(x=>x.id===alunoId);
  if(!a)return;
  if(!a.classes)a.classes=[];
  const idx=a.classes.indexOf(c);
  idx>=0?a.classes.splice(idx,1):a.classes.push(c);
  await db.from("alunos").update({classes:a.classes}).eq("id",alunoId);
  render();
}

function bindAll(){
  const b=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};

  b("btn-login-enc",async()=>{
    const tel=document.getElementById("e-tel").value.trim();
    const pin=document.getElementById("e-pin").value.trim();
    const err=document.getElementById("e-err");
    if(!tel||!pin){err.textContent="Preenche todos os campos.";return;}
    err.textContent="A verificar...";
    const{data,error}=await db.from("encarregados").select("*").eq("telefone",tel).eq("pin",pin).single();
    if(error||!data){err.textContent="Dados incorrectos.";return;}
    const{data:alunos}=await db.from("alunos").select("*").eq("encarregado_id",data.id);
    S.enc={...data,alunos:alunos||[]};
    go("dash-enc");
  });

  b("btn-reg-enc",async()=>{
    const nome=document.getElementById("r-nome").value.trim();
    const tel=document.getElementById("r-tel").value.trim();
    const pin=document.getElementById("r-pin").value.trim();
    const err=document.getElementById("r-err");
    if(!nome||!tel||pin.length<4){err.textContent="Preenche todos os campos.";return;}
    err.textContent="A criar conta...";
    const{data,error}=await db.from("encarregados").insert({nome,telefone:tel,pin}).select().single();
    if(error){err.textContent=error.code==="23505"?"Número já registado.":"Erro ao criar conta.";return;}
    S.enc={...data,alunos:[]};
    go("dash-enc");
  });

  b("btn-add-aluno",async()=>{
    const nome=document.getElementById("a-nome").value.trim();
    const pin=document.getElementById("a-pin").value.trim();
    const cls=Array.from(document.querySelectorAll("#app input[type=checkbox]:checked")).map(c=>c.value);
    const err=document.getElementById("a-err");
    if(!nome||pin.length<4){err.textContent="Preenche nome e PIN.";return;}
    err.textContent="A guardar...";
    const{data,error}=await db.from("alunos").insert({
      encarregado_id:S.enc.id,nome,pin,classes:cls,sessoes:0,certas:0,total:0
    }).select().single();
    if(error){err.textContent="Erro ao adicionar aluno.";return;}
    S.enc.alunos.push(data);
    go("gerir-alunos");
  });

  b("btn-login-aluno",async()=>{
    const nome=document.getElementById("al-nome").value.trim();
    const pin=document.getElementById("al-pin").value.trim();
    const err=document.getElementById("al-err");
    if(!nome||!pin){err.textContent="Preenche todos os campos.";return;}
    err.textContent="A verificar...";
    const{data,error}=await db.from("alunos").select("*").ilike("nome",nome).eq("pin",pin).single();
    if(error||!data){err.textContent="Nome ou PIN incorrecto.";return;}
    S.aluno=data;S.alunoId=data.id;
    const{data:enc}=await db.from("encarregados").select("*").eq("id",data.encarregado_id).single();
    S.enc=enc;
    go("tutor-home");
  });

  b("btn-send",sendChat);
  const chatInp=document.getElementById("chat-inp");
  if(chatInp)chatInp.onkeypress=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}};
}

render();
</script>
</body>
</html>
