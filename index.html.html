<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutorMoz – Matemática</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; min-height: 100vh; color: #1a1a2e; }
  .screen { display: none; max-width: 480px; margin: 0 auto; padding: 16px; }
  .screen.active { display: block; }
  h1 { color: #2563eb; font-size: 1.6rem; }
  h2 { color: #1e40af; font-size: 1.2rem; margin-bottom: 12px; }
  .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; margin-bottom: 10px; }
  input:focus { outline: none; border-color: #2563eb; }
  .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: all 0.2s; }
  .btn-primary { background: #2563eb; color: white; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #e0e7ff; color: #2563eb; }
  .btn-secondary:hover { background: #c7d2fe; }
  .btn-sm { width: auto; padding: 8px 14px; font-size: 0.85rem; }
  .logo { text-align: center; margin: 24px 0 20px; }
  .logo .icon { font-size: 3rem; }
  .logo p { color: #64748b; margin-top: 4px; }
  .error { background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; }
  .aluno-card { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: #f8faff; border-radius: 12px; margin-bottom: 10px; border: 1px solid #e0e7ff; cursor: pointer; }
  .aluno-info h3 { font-size: 1rem; color: #1e40af; }
  .aluno-info p { font-size: 0.8rem; color: #64748b; margin-top: 2px; }
  .topic-card { padding: 14px; background: #f8faff; border-radius: 12px; margin-bottom: 10px; border: 1px solid #e0e7ff; cursor: pointer; transition: all 0.2s; }
  .topic-card:hover { border-color: #2563eb; background: #eff6ff; }
  .topic-card h3 { color: #1e40af; font-size: 0.95rem; }
  .topic-card p { color: #64748b; font-size: 0.8rem; margin-top: 3px; }
  .quiz-question { font-size: 1.05rem; font-weight: 600; color: #1e40af; margin-bottom: 16px; line-height: 1.4; }
  .option-btn { width: 100%; padding: 12px; border: 2px solid #e0e7ff; border-radius: 10px; background: white; text-align: left; cursor: pointer; margin-bottom: 8px; font-size: 0.95rem; transition: all 0.2s; }
  .option-btn:hover { border-color: #2563eb; background: #eff6ff; }
  .option-btn.correct { border-color: #10b981; background: #d1fae5; color: #065f46; }
  .option-btn.wrong { border-color: #ef4444; background: #fee2e2; color: #dc2626; }
  .explanation { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 0.9rem; color: #78350f; line-height: 1.5; }
  .score-circle { width: 100px; height: 100px; border-radius: 50%; background: #2563eb; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 16px auto; font-size: 2rem; font-weight: 700; }
  .score-circle span { font-size: 0.75rem; font-weight: 400; }
  .chat-box { height: 340px; overflow-y: auto; padding: 10px; background: #f8faff; border-radius: 12px; margin-bottom: 10px; }
  .msg { margin-bottom: 12px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; }
  .msg.user .bubble { background: #2563eb; color: white; max-width: 80%; }
  .msg.ai .bubble { background: white; color: #1a1a2e; border: 1px solid #e0e7ff; max-width: 85%; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 0.9rem; line-height: 1.5; word-break: break-word; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { margin-bottom: 0; flex: 1; }
  .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #e0e7ff; color: #1d4ed8; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .tab.active { background: #2563eb; color: white; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #c7d2fe; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .header h2 { margin-bottom: 0; flex: 1; }
  .back-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 1.5rem; padding: 0; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat-box { flex: 1; background: #eff6ff; border-radius: 10px; padding: 12px; text-align: center; }
  .stat-box .num { font-size: 1.4rem; font-weight: 700; color: #2563eb; }
  .stat-box .lbl { font-size: 0.75rem; color: #64748b; }
  .classe-toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f4ff; }
  .toggle { position: relative; width: 44px; height: 24px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 24px; cursor: pointer; transition: 0.3s; }
  .slider:before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.3s; }
  .toggle input:checked + .slider { background: #2563eb; }
  .toggle input:checked + .slider:before { transform: translateX(20px); }
  .sugestoes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .sug-btn { padding: 6px 12px; background: #e0e7ff; color: #1d4ed8; border: none; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
  .intro-box { background: #eff6ff; border-radius: 10px; padding: 14px; margin-bottom: 14px; font-size: 0.9rem; line-height: 1.6; color: #1e40af; }
  .progress-bar { background: #e0e7ff; border-radius: 10px; height: 8px; margin-top: 6px; overflow: hidden; }
  .progress-fill { background: #2563eb; height: 100%; border-radius: 10px; transition: width 0.3s; }
</style>
</head>
<body>

<!-- INICIO -->
<div id="screen-home" class="screen active">
  <div class="logo">
    <div class="icon">📐</div>
    <h1>TutorMoz</h1>
    <p>Matemática para o ensino primário</p>
  </div>
  <div class="card">
    <button class="btn btn-primary" onclick="goTo('screen-guardian-login')">👨‍👩‍👧 Sou Encarregado</button>
    <button class="btn btn-secondary" onclick="goTo('screen-student-select')">🎒 Sou Aluno</button>
  </div>
  <p style="text-align:center;color:#94a3b8;font-size:0.8rem;">mozdomestica.github.io/tutormoz</p>
</div>

<!-- LOGIN ENCARREGADO -->
<div id="screen-guardian-login" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goTo('screen-home')">←</button>
    <h2>Área do Encarregado</h2>
  </div>
  <div class="card">
    <div id="gl-error" class="error" style="display:none"></div>
    <div class="tab-bar">
      <button class="tab active" id="tab-btn-login" onclick="switchTab('login')">Entrar</button>
      <button class="tab" id="tab-btn-register" onclick="switchTab('register')">Criar Conta</button>
    </div>
    <div id="tab-login">
      <input id="gl-telefone" type="tel" placeholder="Telefone (ex: 84xxxxxxx)">
      <input id="gl-pin" type="password" maxlength="4" placeholder="PIN (4 dígitos)">
      <button class="btn btn-primary" onclick="loginGuardian()">Entrar</button>
    </div>
    <div id="tab-register" style="display:none">
      <input id="gr-nome" type="text" placeholder="Nome completo">
      <input id="gr-telefone" type="tel" placeholder="Telefone (ex: 84xxxxxxx)">
      <input id="gr-pin" type="password" maxlength="4" placeholder="Criar PIN (4 dígitos)">
      <button class="btn btn-primary" onclick="registerGuardian()">Criar Conta</button>
    </div>
  </div>
</div>

<!-- DASHBOARD ENCARREGADO -->
<div id="screen-guardian-dash" class="screen">
  <div class="header">
    <button class="back-btn" onclick="logoutGuardian()">←</button>
    <h2 id="gd-nome">Dashboard</h2>
  </div>
  <div id="gd-error" class="error" style="display:none"></div>
  <div id="gd-alunos"></div>
  <div class="card">
    <h2>➕ Adicionar Aluno</h2>
    <input id="na-nome" type="text" placeholder="Nome do aluno">
    <input id="na-pin" type="password" maxlength="4" placeholder="PIN do aluno (4 dígitos)">
    <button class="btn btn-primary" onclick="addAluno()">Adicionar</button>
  </div>
</div>

<!-- DETALHE ALUNO (encarregado) -->
<div id="screen-aluno-detail" class="screen">
  <div class="header">
    <button class="back-btn" onclick="loadGuardianDash()">←</button>
    <h2 id="ad-nome">Aluno</h2>
  </div>
  <div class="card">
    <div class="stat-row">
      <div class="stat-box"><div class="num" id="ad-sessoes">0</div><div class="lbl">Sessões</div></div>
      <div class="stat-box"><div class="num" id="ad-certas">0</div><div class="lbl">Certas</div></div>
      <div class="stat-box"><div class="num" id="ad-precisao">0%</div><div class="lbl">Precisão</div></div>
    </div>
    <h2 style="margin-bottom:10px">Classes Activas</h2>
    <div id="ad-classes"></div>
  </div>
</div>

<!-- SELECCIONAR ALUNO -->
<div id="screen-student-select" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goTo('screen-home')">←</button>
    <h2>Qual é o teu nome?</h2>
  </div>
  <div id="ss-error" class="error" style="display:none"></div>
  <div class="card">
    <div id="ss-alunos"><p style="color:#64748b;text-align:center">A carregar...</p></div>
  </div>
  <div class="card" id="ss-pin-box" style="display:none">
    <h2 id="ss-pin-title">Insere o teu PIN</h2>
    <input id="ss-pin" type="password" maxlength="4" placeholder="PIN (4 dígitos)">
    <button class="btn btn-primary" onclick="loginAluno()">Entrar</button>
  </div>
</div>

<!-- DASHBOARD ALUNO -->
<div id="screen-student-dash" class="screen">
  <div class="header">
    <button class="back-btn" onclick="logoutAluno()">←</button>
    <h2 id="sd-nome">Olá!</h2>
  </div>
  <div class="tab-bar">
    <button class="tab active" id="tab-temas" onclick="showStudentTab('temas')">📚 Temas</button>
    <button class="tab" id="tab-chat" onclick="showStudentTab('chat')">🤖 Tutor IA</button>
  </div>
  <div id="sd-temas"><div id="sd-classes"></div></div>
  <div id="sd-chat" style="display:none">
    <div class="card">
      <div class="sugestoes">
        <button class="sug-btn" onclick="sendSugestao('O que são fracções?')">O que são fracções?</button>
        <button class="sug-btn" onclick="sendSugestao('Como somo números grandes?')">Como somar grandes?</button>
        <button class="sug-btn" onclick="sendSugestao('O que é o perímetro?')">O que é perímetro?</button>
        <button class="sug-btn" onclick="sendSugestao('Como faço divisão?')">Como faço divisão?</button>
      </div>
      <div class="chat-box" id="chat-box"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Escreve a tua dúvida..." onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn btn-primary btn-sm" onclick="sendChat()" id="chat-send-btn">Enviar</button>
      </div>
    </div>
  </div>
</div>

<!-- TEMA -->
<div id="screen-topic" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goTo('screen-student-dash')">←</button>
    <h2 id="topic-title">Tema</h2>
  </div>
  <div class="card">
    <div class="intro-box" id="topic-intro"></div>
    <button class="btn btn-primary" onclick="startQuiz()">Começar Exercícios →</button>
    <button class="btn btn-secondary" onclick="showStudentTab('chat'); goTo('screen-student-dash')">💬 Tenho dúvidas</button>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="header">
    <button class="back-btn" onclick="goTo('screen-topic')">←</button>
    <h2 id="quiz-title">Exercício</h2>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px">
      <span id="quiz-prog" style="color:#64748b;font-size:0.85rem"></span>
      <span id="quiz-score" style="color:#2563eb;font-weight:600;font-size:0.85rem"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="quiz-bar"></div></div>
    <br>
    <div class="quiz-question" id="quiz-q"></div>
    <div id="quiz-opts"></div>
    <div id="quiz-expl" class="explanation" style="display:none"></div>
    <button class="btn btn-primary" id="quiz-next" style="display:none;margin-top:10px" onclick="nextQuestion()">Próxima →</button>
  </div>
</div>

<!-- RESULTADO -->
<div id="screen-result" class="screen">
  <div class="card" style="text-align:center">
    <h2 id="res-title">Resultado</h2>
    <div class="score-circle" id="res-circle">
      <div id="res-score"></div>
      <span id="res-total"></span>
    </div>
    <p id="res-msg" style="color:#64748b;margin-bottom:16px"></p>
    <button class="btn btn-primary" onclick="goTo('screen-student-dash')">Voltar aos Temas</button>
    <button class="btn btn-secondary" onclick="showStudentTab('chat'); goTo('screen-student-dash')">💬 Pedir ajuda ao Tutor IA</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://sacgiyeekwzxcgyceocz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GyP1cwoTRovYiqOrmy28wA_MEnOhZq1';
const GROQ_KEY = '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';
const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentGuardian = null;
let currentAluno = null;
let currentTopic = null;
let quizData = { questions: [], current: 0, score: 0 };
let chatHistory = [];
let selectedAlunoId = null;

const CURRICULUM = {
  '4ª Classe': [
    { title: 'Números até 1000', intro: 'Os números até 1000 ajudam-nos a contar coisas do dia-a-dia. Por exemplo: uma loja tem 850 sacos de arroz. O número 850 tem 8 centenas, 5 dezenas e 0 unidades.',
      questions: [
        { q: 'Quanto é 400 + 350?', opts: ['650','750','700','800'], ans: 1, expl: '400 + 350 = 750. Somamos as centenas (4+3=7) e as dezenas (0+5=5). Resultado: 750.' },
        { q: 'O número 637 tem quantas dezenas?', opts: ['6','3','7','63'], ans: 1, expl: 'No 637: 6=centenas, 3=dezenas, 7=unidades. Resposta: 3 dezenas.' },
        { q: 'Qual é o maior número? 489, 498, 849, 894', opts: ['489','498','849','894'], ans: 3, expl: 'Comparamos as centenas: 8 > 4. Entre 849 e 894, as dezenas: 9 > 4. Logo 894 é o maior.' },
        { q: 'Quanto é 1000 - 250?', opts: ['650','700','750','850'], ans: 2, expl: '1000 - 250 = 750. Verificação: 250 + 750 = 1000 ✓' },
        { q: 'Uma vendedora tem 425 laranjas e recebe 375 mais. Quantas ao total?', opts: ['700','800','750','780'], ans: 1, expl: '425 + 375 = 800. Unidades: 5+5=10 (transporta 1). Dezenas: 2+7+1=10 (transporta 1). Centenas: 4+3+1=8.' }
      ]
    },
    { title: 'Adição e Subtracção', intro: 'A adição junta quantidades e a subtracção tira quantidades. São as operações mais usadas no mercado quando compramos e recebemos troco.',
      questions: [
        { q: 'Compras uma manga por 15 Mt e um pão por 8 Mt. Quanto gastas?', opts: ['20 Mt','23 Mt','22 Mt','25 Mt'], ans: 1, expl: '15 + 8 = 23 Mt.' },
        { q: 'Tens 100 Mt e gastas 37 Mt. Quanto fica?', opts: ['63 Mt','73 Mt','67 Mt','53 Mt'], ans: 0, expl: '100 - 37 = 63 Mt. Verificação: 37 + 63 = 100 ✓' },
        { q: 'Uma turma tem 45 rapazes e 38 raparigas. Quantos alunos?', opts: ['73','83','93','63'], ans: 1, expl: '45 + 38 = 83 alunos.' },
        { q: 'Qual é o resultado de 356 + 244?', opts: ['590','600','580','610'], ans: 1, expl: '356 + 244 = 600.' },
        { q: 'Há 500 sacos de milho. Vendem-se 185. Quantos ficam?', opts: ['305','315','325','295'], ans: 1, expl: '500 - 185 = 315. Verificação: 185 + 315 = 500 ✓' }
      ]
    },
    { title: 'Multiplicação', intro: 'A multiplicação é uma forma rápida de somar grupos iguais. 4 × 6 significa 4 grupos de 6, ou seja 6+6+6+6 = 24.',
      questions: [
        { q: 'Quanto é 7 × 8?', opts: ['54','56','58','52'], ans: 1, expl: '7 × 8 = 56. Tabuada do 7: ...7×7=49, 7×8=56.' },
        { q: 'Uma caixa tem 6 laranjas. Quantas há em 9 caixas?', opts: ['48','54','56','45'], ans: 1, expl: '6 × 9 = 54 laranjas.' },
        { q: 'Quanto é 5 × 7?', opts: ['30','35','40','25'], ans: 1, expl: '5 × 7 = 35. A tabuada do 5 termina sempre em 0 ou 5.' },
        { q: 'Qual o resultado de 4 × 25?', opts: ['80','90','100','120'], ans: 2, expl: '4 × 25 = 100. Cálculo: 4×20=80, 4×5=20. Total: 80+20=100.' },
        { q: 'Uma carteira custa 150 Mt. Qual o preço de 3 carteiras?', opts: ['350 Mt','400 Mt','450 Mt','500 Mt'], ans: 2, expl: '3 × 150 = 450 Mt. Cálculo: 3×100=300, 3×50=150. Total: 300+150=450 Mt.' }
      ]
    },
    { title: 'Divisão', intro: 'A divisão reparte uma quantidade em partes iguais. Se tens 20 mangas para 4 amigos, cada um fica com 20÷4 = 5 mangas.',
      questions: [
        { q: 'Quanto é 48 ÷ 6?', opts: ['6','7','8','9'], ans: 2, expl: '48 ÷ 6 = 8. Verificação: 6 × 8 = 48 ✓' },
        { q: 'Tens 35 Mt para dividir por 5 pessoas. Quanto fica cada um?', opts: ['5 Mt','6 Mt','7 Mt','8 Mt'], ans: 2, expl: '35 ÷ 5 = 7 Mt. Verificação: 5 × 7 = 35 ✓' },
        { q: 'Quanto é 72 ÷ 9?', opts: ['6','7','8','9'], ans: 2, expl: '72 ÷ 9 = 8. Verificação: 9 × 8 = 72 ✓' },
        { q: 'Uma corda de 56 cm é cortada em 7 pedaços iguais. Quanto mede cada um?', opts: ['6 cm','7 cm','8 cm','9 cm'], ans: 2, expl: '56 ÷ 7 = 8 cm. Verificação: 7 × 8 = 56 ✓' },
        { q: 'Quanto é 90 ÷ 3?', opts: ['20','25','30','35'], ans: 2, expl: '90 ÷ 3 = 30. Dica: 9÷3=3, logo 90÷3=30.' }
      ]
    },
    { title: 'Fracções Simples', intro: 'Uma fracção representa uma parte de um todo. Se cortas uma laranja ao meio, cada parte é 1/2. O número de baixo diz em quantas partes dividiste.',
      questions: [
        { q: 'Uma pizza tem 4 partes iguais. Comes 1 parte. Que fracção comeste?', opts: ['1/2','1/3','1/4','2/4'], ans: 2, expl: '1/4 (um quarto). A pizza tem 4 partes e comeste 1.' },
        { q: 'Qual fracção representa metade?', opts: ['1/4','1/2','2/3','3/4'], ans: 1, expl: '1/2 representa metade. Dividimos em 2 partes e tomamos 1.' },
        { q: 'Qual fracção é maior: 1/2 ou 1/4?', opts: ['1/4','São iguais','1/2','Não se compara'], ans: 2, expl: '1/2 é maior. Metade de uma laranja é maior que um quarto. Quanto maior o denominador, menor a parte.' },
        { q: 'Um bolo tem 8 fatias. Comes 3. Que fracção comeste?', opts: ['3/5','3/8','5/8','8/3'], ans: 1, expl: '3/8 (três oitavos). Total=8 fatias, comeste=3.' },
        { q: 'Quanto é 1/2 de 20 Mt?', opts: ['5 Mt','8 Mt','10 Mt','15 Mt'], ans: 2, expl: '1/2 de 20 = 20 ÷ 2 = 10 Mt.' }
      ]
    },
    { title: 'Medidas de Comprimento', intro: 'Usamos cm e m para medir comprimentos. 100 cm = 1 m. Usamos estas medidas para medir o comprimento de uma mesa, a altura de uma pessoa, etc.',
      questions: [
        { q: 'Quantos cm tem 2 metros?', opts: ['20 cm','100 cm','200 cm','2000 cm'], ans: 2, expl: '2 m = 200 cm. Como 1 m = 100 cm, então 2 × 100 = 200 cm.' },
        { q: 'Uma corda tem 350 cm. Quantos metros tem?', opts: ['3 m','3,5 m','35 m','0,35 m'], ans: 1, expl: '350 cm = 3,5 m. Dividimos por 100: 350 ÷ 100 = 3,5 m.' },
        { q: 'Uma sala mede 5 m × 4 m. Qual é o perímetro?', opts: ['9 m','18 m','20 m','16 m'], ans: 1, expl: 'Perímetro = 2 × (5+4) = 2 × 9 = 18 m.' },
        { q: 'João tem 1,50 m e Maria 1,35 m. Qual a diferença?', opts: ['10 cm','15 cm','20 cm','25 cm'], ans: 1, expl: '1,50 - 1,35 = 0,15 m = 15 cm.' },
        { q: 'Uma régua tem 30 cm. Três réguas em fila têm quantos metros?', opts: ['0,3 m','0,9 m','9 m','90 m'], ans: 1, expl: '3 × 30 = 90 cm = 0,9 m.' }
      ]
    },
    { title: 'Geometria Básica', intro: 'As formas geométricas estão em todo o lado! Um quadrado tem 4 lados iguais, um triângulo tem 3 lados e um círculo é redondo.',
      questions: [

// NAVEGAÇÃO
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if (id === 'screen-student-select') loadAlunoList();
}

function switchTab(tab) {
  document.getElementById('tab-login').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('tab-register').style.display = tab==='register' ? 'block' : 'none';
  document.getElementById('tab-btn-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-btn-register').classList.toggle('active', tab==='register');
  document.getElementById('gl-error').style.display = 'none';
}

function showErr(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.style.display='block'; }
function hideErr(id) { document.getElementById(id).style.display='none'; }

// ENCARREGADO
async function registerGuardian() {
  const nome=document.getElementById('gr-nome').value.trim();
  const telefone=document.getElementById('gr-telefone').value.trim();
  const pin=document.getElementById('gr-pin').value.trim();
  hideErr('gl-error');
  if (!nome||!telefone||!pin||pin.length!==4) { showErr('gl-error','Preenche todos os campos. O PIN deve ter 4 dígitos.'); return; }
  const { data, error } = await db.from('encarregados').insert([{nome,telefone,pin}]).select().single();
  if (error) { showErr('gl-error', error.code==='23505' ? 'Este telefone já está registado.' : 'Erro ao criar conta.'); return; }
  currentGuardian = data;
  loadGuardianDash();
}

async function loginGuardian() {
  const telefone=document.getElementById('gl-telefone').value.trim();
  const pin=document.getElementById('gl-pin').value.trim();
  hideErr('gl-error');
  if (!telefone||!pin) { showErr('gl-error','Preenche o telefone e o PIN.'); return; }
  const { data, error } = await db.from('encarregados').select('*').eq('telefone',telefone).eq('pin',pin).single();
  if (error||!data) { showErr('gl-error','Telefone ou PIN incorrectos.'); return; }
  currentGuardian = data;
  loadGuardianDash();
}

function logoutGuardian() { currentGuardian=null; goTo('screen-home'); }

async function loadGuardianDash() {
  document.getElementById('gd-nome').textContent = '👋 ' + currentGuardian.nome.split(' ')[0];
  const { data: alunos } = await db.from('alunos').select('*').eq('encarregado_id', currentGuardian.id);
  const c = document.getElementById('gd-alunos');
  if (!alunos||!alunos.length) {
    c.innerHTML = '<div class="card"><p style="color:#64748b;text-align:center">Ainda não adicionaste nenhum aluno.</p></div>';
  } else {
    c.innerHTML = alunos.map(a => {
      const prec = a.total>0 ? Math.round((a.certas/a.total)*100) : 0;
      return `<div class="card aluno-card" onclick="openAlunoDetail('${a.id}')">
        <div class="aluno-info"><h3>🎒 ${a.nome}</h3><p>Classes: ${(a.classes||[]).join(', ')||'Nenhuma'}</p><p>Sessões: ${a.sessoes} | Precisão: ${prec}%</p></div>
        <span>›</span></div>`;
    }).join('');
  }
  goTo('screen-guardian-dash');
}

async function addAluno() {
  const nome=document.getElementById('na-nome').value.trim();
  const pin=document.getElementById('na-pin').value.trim();
  hideErr('gd-error');
  if (!nome||!pin||pin.length!==4) { showErr('gd-error','Nome e PIN de 4 dígitos são obrigatórios.'); return; }
  const { error } = await db.from('alunos').insert([{encarregado_id:currentGuardian.id,nome,pin,classes:[],sessoes:0,certas:0,total:0}]);
  if (error) { showErr('gd-error','Erro ao adicionar aluno.'); return; }
  document.getElementById('na-nome').value='';
  document.getElementById('na-pin').value='';
  loadGuardianDash();
}

async function openAlunoDetail(id) {
  const { data: a } = await db.from('alunos').select('*').eq('id',id).single();
  if (!a) return;
  currentAluno = a;
  document.getElementById('ad-nome').textContent = a.nome;
  const prec = a.total>0 ? Math.round((a.certas/a.total)*100) : 0;
  document.getElementById('ad-sessoes').textContent = a.sessoes;
  document.getElementById('ad-certas').textContent = a.certas;
  document.getElementById('ad-precisao').textContent = prec+'%';
  const classes=['4ª Classe','5ª Classe','6ª Classe'];
  document.getElementById('ad-classes').innerHTML = classes.map(cl => {
    const active=(a.classes||[]).includes(cl);
    return `<div class="classe-toggle">
      <span>${cl} <small style="color:#64748b">(150 Mt/mês)</small></span>
      <label class="toggle"><input type="checkbox" ${active?'checked':''} onchange="toggleClass('${a.id}','${cl}',this.checked)"><span class="slider"></span></label>
    </div>`;
  }).join('');
  goTo('screen-aluno-detail');
}

async function toggleClass(alunoId, classe, active) {
  const { data: a } = await db.from('alunos').select('classes').eq('id',alunoId).single();
  let cls = a.classes||[];
  if (active) { if(!cls.includes(classe)) cls.push(classe); }
  else { cls = cls.filter(c=>c!==classe); }
  await db.from('alunos').update({classes:cls}).eq('id',alunoId);
}

// ALUNO
async function loadAlunoList() {
  const { data: alunos } = await db.from('alunos').select('id,nome');
  const c = document.getElementById('ss-alunos');
  if (!alunos||!alunos.length) { c.innerHTML='<p style="color:#64748b;text-align:center">Nenhum aluno registado ainda.</p>'; return; }
  c.innerHTML = alunos.map(a=>`<button class="btn btn-secondary" onclick="selectAluno('${a.id}','${a.nome}')">${a.nome}</button>`).join('');
}

function selectAluno(id, nome) {
  selectedAlunoId = id;
  document.getElementById('ss-pin-title').textContent = 'PIN de '+nome;
  document.getElementById('ss-pin-box').style.display = 'block';
  document.getElementById('ss-pin').value = '';
  document.getElementById('ss-pin').focus();
}

async function loginAluno() {
  const pin = document.getElementById('ss-pin').value.trim();
  hideErr('ss-error');
  if (!pin) { showErr('ss-error','Insere o PIN.'); return; }
  const { data, error } = await db.from('alunos').select('*').eq('id',selectedAlunoId).eq('pin',pin).single();
  if (error||!data) { showErr('ss-error','PIN incorrecto.'); return; }
  currentAluno = data;
  loadStudentDash();
}

function logoutAluno() { currentAluno=null; chatHistory=[]; document.getElementById('chat-box').innerHTML=''; goTo('screen-home'); }

function loadStudentDash() {
  document.getElementById('sd-nome').textContent = '👋 '+currentAluno.nome.split(' ')[0]+'!';
  const classes = currentAluno.classes||[];
  const c = document.getElementById('sd-classes');
  if (!classes.length) {
    c.innerHTML='<div class="card"><p style="color:#64748b">O teu encarregado ainda não activou nenhuma classe. Pede-lhe para activar!</p></div>';
  } else {
    c.innerHTML = classes.map(classe => {
      const topics = CURRICULUM[classe]||[];
      return `<div class="card"><h2>📖 ${classe}</h2>${topics.map((t,i)=>
        `<div class="topic-card" onclick="openTopic('${classe}',${i})"><h3>${t.title}</h3><p>${t.questions.length} exercícios</p></div>`
      ).join('')}</div>`;
    }).join('');
  }
  showStudentTab('temas');
  goTo('screen-student-dash');
}

function showStudentTab(tab) {
  document.getElementById('sd-temas').style.display = tab==='temas'?'block':'none';
  document.getElementById('sd-chat').style.display = tab==='chat'?'block':'none';
  document.getElementById('tab-temas').classList.toggle('active', tab==='temas');
  document.getElementById('tab-chat').classList.toggle('active', tab==='chat');
}

// QUIZ
function openTopic(classe, index) {
  currentTopic = { classe, index, topic: CURRICULUM[classe][index] };
  document.getElementById('topic-title').textContent = currentTopic.topic.title;
  document.getElementById('topic-intro').textContent = currentTopic.topic.intro;
  goTo('screen-topic');
}

function startQuiz() {
  quizData = { questions: currentTopic.topic.questions, current: 0, score: 0 };
  renderQuestion();
  goTo('screen-quiz');
}

function renderQuestion() {
  const q = quizData.questions[quizData.current];
  document.getElementById('quiz-title').textContent = currentTopic.topic.title;
  document.getElementById('quiz-q').textContent = q.q;
  document.getElementById('quiz-prog').textContent = `Questão ${quizData.current+1} de ${quizData.questions.length}`;
  document.getElementById('quiz-score').textContent = `✓ ${quizData.score}`;
  document.getElementById('quiz-bar').style.width = (quizData.current/quizData.questions.length*100)+'%';
  document.getElementById('quiz-expl').style.display = 'none';
  document.getElementById('quiz-next').style.display = 'none';
  document.getElementById('quiz-opts').innerHTML = q.opts.map((o,i)=>
    `<button class="option-btn" onclick="selectAnswer(${i})">${o}</button>`
  ).join('');
}

async function selectAnswer(idx) {
  const q = quizData.questions[quizData.current];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b=>b.disabled=true);
  const correct = idx===q.ans;
  btns[idx].classList.add(correct?'correct':'wrong');
  if (!correct) btns[q.ans].classList.add('correct');
  if (correct) quizData.score++;
  document.getElementById('quiz-expl').textContent = (correct?'✅ Correcto! ':'❌ Incorreto. ')+q.expl;
  document.getElementById('quiz-expl').style.display = 'block';
  document.getElementById('quiz-next').style.display = 'block';
  const nt=(currentAluno.total||0)+1, nc=(currentAluno.certas||0)+(correct?1:0);
  await db.from('alunos').update({total:nt,certas:nc}).eq('id',currentAluno.id);
  currentAluno.total=nt; currentAluno.certas=nc;
}

function nextQuestion() {
  quizData.current++;
  if (quizData.current >= quizData.questions.length) { showResult(); return; }
  renderQuestion();
}

async function showResult() {
  const ns = (currentAluno.sessoes||0)+1;
  await db.from('alunos').update({sessoes:ns}).eq('id',currentAluno.id);
  currentAluno.sessoes=ns;
  const pct = Math.round((quizData.score/quizData.questions.length)*100);
  document.getElementById('res-title').textContent = currentTopic.topic.title;
  document.getElementById('res-score').textContent = quizData.score+'/'+quizData.questions.length;
  document.getElementById('res-total').textContent = pct+'%';
  document.getElementById('res-circle').style.background = pct>=60?'#10b981':'#f59e0b';
  document.getElementById('res-msg').textContent = pct>=80?'🌟 Excelente! Continua assim!':pct>=60?'👍 Bom trabalho! Podes melhorar!':'💪 Revê o tema e tenta novamente!';
  goTo('screen-result');
}

// CHAT IA
function addMessage(role, text) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'msg '+role;
  div.innerHTML = `<div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value='';
  addMessage('user', msg);
  chatHistory.push({role:'user', content:msg});
  const btn = document.getElementById('chat-send-btn');
  btn.disabled=true; btn.textContent='...';
  const thinking = document.createElement('div');
  thinking.className='msg ai';
  thinking.innerHTML='<div class="bubble"><span class="spinner"></span> A pensar...</div>';
  document.getElementById('chat-box').appendChild(thinking);
  document.getElementById('chat-box').scrollTop = 99999;
  try {
    const resp = await fetch(GROQ_URL, {
      method:'POST',
      headers:{'Authorization':'Bearer '+GROQ_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'llama-3.1-8b-instant',
        messages:[
          {role:'system', content:'És o Tutor Moz, um assistente de matemática simpático e paciente para alunos moçambicanos do ensino primário (4ª, 5ª e 6ª classe). Respondes SEMPRE em português. Usas exemplos do dia-a-dia moçambicano: meticais, mercados, xima, machamba, capulanas, chapas, etc. Explicas passo a passo de forma simples e encorajadora. Respondes APENAS a perguntas de matemática. Se perguntarem outra coisa, redireccionas gentilmente para matemática.'},
          ...chatHistory.slice(-10)
        ],
        max_tokens:500,temperature:0.7
      })
    });
    thinking.remove();
    if (!resp.ok) { const e=await resp.json(); throw new Error(e.error?.message||'Erro API'); }
    const data = await resp.json();
    const reply = data.choices?.[0]?.message?.content || 'Não consegui responder. Tenta novamente!';
    chatHistory.push({role:'assistant', content:reply});
    addMessage('ai', reply);
  } catch(e) {
    thinking.remove();
    addMessage('ai', '⚠️ Erro: '+e.message+'. Verifica a tua ligação e tenta novamente.');
    console.error(e);
  }
  btn.disabled=false; btn.textContent='Enviar';
}

function sendSugestao(text) {
  document.getElementById('chat-input').value=text;
  sendChat();
}
</script>
